[project]
name = "agentx-mcp-service"
version = "0.1.0"
description = "Bounded, Kueue-managed AgentX benchmark service"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
agentx-service = "agentx_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
