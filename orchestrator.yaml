apiVersion: v1
kind: ServiceAccount
metadata:
  name: __ORCHESTRATOR_NAME__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: __ORCHESTRATOR_NAME__
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: __ORCHESTRATOR_NAME__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: __ORCHESTRATOR_NAME__
subjects:
  - kind: ServiceAccount
    name: __ORCHESTRATOR_NAME__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __ORCHESTRATOR_NAME__
  labels:
    app: __ORCHESTRATOR_NAME__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: __ORCHESTRATOR_NAME__
  template:
    metadata:
      labels:
        app: __ORCHESTRATOR_NAME__
    spec:
      serviceAccountName: __ORCHESTRATOR_NAME__
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: orchestrator
          image: quay.io/tms/benchmark-orchestrator:amd64
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
          workingDir: /workspace
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: orchestrator-spec
              mountPath: /workspace/benchmark-sweep.env
              subPath: benchmark-sweep.env
      volumes:
        - name: orchestrator-spec
          configMap:
            name: __ORCHESTRATOR_SPEC_CONFIGMAP__
